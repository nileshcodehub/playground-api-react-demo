<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="favBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#080e1a"/>
    </linearGradient>
    <linearGradient id="favGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
    <linearGradient id="favBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="favGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#f59e0b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Container Box -->
  <rect width="512" height="512" rx="128" fill="url(#favBg)" stroke="url(#favGold)" stroke-width="12"/>

  <g filter="url(#favGlow)">
    <!-- Left Column Bar -->
    <rect x="120" y="180" width="48" height="160" rx="24" fill="url(#favBlue)"/>
    <!-- Middle Tall Bar -->
    <rect x="200" y="120" width="48" height="280" rx="24" fill="url(#favGold)"/>
    <!-- Right Forward Chevron -->
    <path d="M 285 160 L 390 256 L 285 352" fill="none" stroke="url(#favGold)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
